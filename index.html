<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1f6feb">
<title>区域1 桔梗が丘1番町A</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
:root{
--grey:#8a8f98; --blue:#1f6feb; --red:#d9333f; --green:#2ea043;
--bar:#1f2937; --panel:#ffffff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;font-family:system-ui,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;}
#app{display:flex;flex-direction:column;height:100dvh;}
header{background:var(--bar);color:#fff;padding:8px 12px;display:flex;align-items:center;gap:8px;}
header .no{background:var(--blue);border-radius:6px;padding:2px 9px;font-weight:700;font-size:15px;}
header .name{font-size:15px;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
header .count{font-size:12px;opacity:.85;}
#notice{flex:0 0 auto;}
.revisit-bar{background:var(--blue);color:#fff;padding:9px 12px;font-size:13px;display:none;align-items:center;gap:8px;cursor:pointer;}
.revisit-bar .ic{font-size:15px;}
.revisit-bar b{font-weight:700;}
.revisit-bar .go{margin-left:auto;font-size:12px;opacity:.92;white-space:nowrap;}
#map{flex:1;width:100%;background:#e8e8e8;}
.toolbar{position:absolute;left:10px;bottom:18px;z-index:1000;display:flex;flex-direction:column;gap:8px;}
.toolbar button{width:50px;height:50px;border:none;border-radius:50%;background:var(--panel);
box-shadow:0 2px 8px rgba(0,0,0,.3);font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.toolbar button.active{background:var(--blue);color:#fff;}
.legend{position:absolute;right:10px;bottom:18px;z-index:1000;background:rgba(255,255,255,.94);
border-radius:10px;padding:8px 10px;font-size:12px;box-shadow:0 2px 8px rgba(0,0,0,.2);line-height:1.7;}
.legend .dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:5px;vertical-align:-1px;border:2px solid #fff;box-shadow:0 0 0 1px #aaa;}
.hint{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:1000;background:rgba(31,111,235,.95);
color:#fff;padding:7px 14px;border-radius:20px;font-size:13px;box-shadow:0 2px 8px rgba(0,0,0,.3);display:none;}
.house-pin{border-radius:50%;border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.5);width:18px;height:18px;}
.terr-label{background:var(--red);color:#fff;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;border:2px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.45);}
.lp{min-width:190px;font-size:14px;}
.lp h4{margin:0 0 6px;font-size:14px;}
.lp .sts{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap;}
.lp .sts button{flex:1;min-width:56px;border:1px solid #ccc;border-radius:6px;padding:6px 4px;font-size:12px;background:#fff;cursor:pointer;}
.lp .sts button.on{color:#fff;border-color:transparent;font-weight:700;}
.lp textarea{width:100%;border:1px solid #ccc;border-radius:6px;padding:6px;font-size:13px;resize:vertical;min-height:38px;font-family:inherit;}
.lp .gmap{display:block;text-align:center;margin-top:8px;background:#34a853;color:#fff;text-decoration:none;
border-radius:6px;padding:8px;font-size:13px;font-weight:600;}
.lp .row{display:flex;justify-content:space-between;align-items:center;margin-top:8px;}
.lp .del{color:var(--red);background:none;border:none;font-size:13px;cursor:pointer;}
.lp .date{font-size:11px;color:#888;}
.sheet{position:absolute;inset:0;z-index:1100;background:rgba(0,0,0,.4);display:none;align-items:flex-end;}
.sheet .card{background:#fff;width:100%;max-height:75%;overflow:auto;border-radius:16px 16px 0 0;padding:14px 16px 24px;}
.sheet h3{margin:4px 0 12px;font-size:16px;display:flex;justify-content:space-between;}
.sheet h3 .x{color:#888;cursor:pointer;}
.listnote{font-size:12px;color:#1f6feb;background:#eef4ff;border-radius:8px;padding:7px 10px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;}
.listnote a{color:#1f6feb;cursor:pointer;text-decoration:underline;}
.litem{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #eee;font-size:14px;cursor:pointer;}
.litem .memo{color:#666;font-size:12px;}
.litem .badge{font-size:11px;padding:2px 7px;border-radius:10px;color:#fff;margin-left:auto;white-space:nowrap;}
.empty{color:#999;text-align:center;padding:24px 0;font-size:13px;}
.sheet .tools{display:flex;gap:8px;margin-top:14px;}
.sheet .tools button{flex:1;border:1px solid #ccc;background:#fff;border-radius:8px;padding:10px;font-size:13px;cursor:pointer;}
.bulk{margin-top:16px;border-top:1px solid #eee;padding-top:12px;}
.bulk-t{font-size:12px;color:#666;margin-bottom:8px;}
.bulk-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.bulk-btns button{color:#fff;border:none;border-radius:8px;padding:10px;font-size:13px;font-weight:600;cursor:pointer;}
.done{position:absolute;inset:0;z-index:1200;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:20px;}
.done-card{background:#fff;border-radius:18px;max-width:340px;width:100%;padding:26px 22px 22px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.3);animation:pop .3s ease;}
@keyframes pop{from{transform:scale(.85);opacity:0;}to{transform:scale(1);opacity:1;}}
.done-emoji{font-size:46px;line-height:1;}
.done-card h2{margin:10px 0 4px;font-size:22px;color:#1f2937;}
.done-sub{margin:0 0 16px;font-size:13px;color:#666;}
.done-verse{background:#f1f7f2;border-radius:12px;padding:14px;color:#2f4636;font-size:15px;line-height:1.6;}
.done-verse .ref{display:block;color:#5b8c6e;font-size:12px;margin-top:6px;}
.done-card .close{margin-top:18px;width:100%;border:none;border-radius:10px;background:var(--green);color:#fff;padding:12px;font-size:15px;font-weight:600;cursor:pointer;}
.svc-pill{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);z-index:1000;border:none;border-radius:24px;padding:12px 20px;font-size:15px;font-weight:700;color:#fff;background:var(--green);box-shadow:0 3px 12px rgba(0,0,0,.4);cursor:pointer;white-space:nowrap;}
.svc-pill.running{background:var(--red);}
.svc-sum{background:#eef7f0;border:1px solid #cce8d4;border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:12px;color:#1f3a29;}
.svc-sum b{font-size:16px;}
.svc-item{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid #eee;font-size:14px;}
.svc-item .d{font-weight:600;}
.svc-item .sub{color:#666;font-size:12px;margin-top:2px;}
.svc-item .svc-del{margin-left:auto;border:none;background:none;color:#d9333f;font-size:20px;line-height:1;cursor:pointer;padding:0 6px;}
.sec-title{font-size:13px;font-weight:700;color:#555;margin:4px 0 8px;}
.sec-title.div{border-top:1px solid #eee;margin-top:18px;padding-top:14px;}
.ov-listbtn{display:none;position:absolute;left:50%;transform:translateX(-50%);top:54px;z-index:1000;border:none;border-radius:22px;padding:10px 18px;font-size:14px;font-weight:700;background:#fff;color:#1f2937;box-shadow:0 2px 10px rgba(0,0,0,.3);cursor:pointer;}
.ov-sum{background:#f4f6f8;border-radius:10px;padding:9px 12px;font-size:13px;margin-bottom:10px;color:#3a4654;}
.ov-sum b{font-size:15px;color:#1e7a34;}
.ov-item{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid #eee;font-size:15px;cursor:pointer;}
.ov-item .num{background:#d9333f;color:#fff;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;flex:0 0 auto;font-size:14px;}
.ov-item .nm{flex:1;}
.ov-badge{font-size:12px;padding:3px 10px;border-radius:12px;font-weight:600;white-space:nowrap;}
.ov-badge.free{background:#e6f4ea;color:#1e7a34;}
.ov-badge.used{background:#eceff1;color:#637381;}
.ov-badge.na{background:#f3f0ff;color:#6b5bd1;}
.apt-pin{border-radius:6px;border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.5);width:26px;height:26px;background:#0e8c8c;color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;}
.aptname{width:100%;border:1px solid #ccc;border-radius:8px;padding:8px;font-size:14px;margin-bottom:8px;font-family:inherit;}
.addroom{display:flex;gap:8px;margin:10px 0;}
.addroom input{flex:1;border:1px solid #ccc;border-radius:8px;padding:9px;font-size:15px;font-family:inherit;}
.addroom button{border:none;background:#0e8c8c;color:#fff;border-radius:8px;padding:9px 16px;font-size:14px;font-weight:700;cursor:pointer;}
.room{display:flex;align-items:center;gap:6px;padding:9px 0;border-bottom:1px solid #eee;}
.room .rno{font-weight:700;min-width:50px;font-size:15px;}
.room .rbtns{display:flex;gap:4px;flex-wrap:wrap;flex:1;}
.room .rbtns button{border:1px solid #ccc;border-radius:6px;padding:5px 6px;font-size:11px;background:#fff;cursor:pointer;}
.room .rbtns button.on{color:#fff;border-color:transparent;font-weight:700;}
.room .rdel{color:#d9333f;background:none;border:none;font-size:16px;cursor:pointer;}
.aptsum{font-size:12px;color:#0e8c8c;background:#e9f6f6;border-radius:8px;padding:7px 10px;margin-bottom:8px;}
.toolbar button#btnAddApt.active{background:#0e8c8c;color:#fff;}
.dnc-pin{width:24px;height:24px;border-radius:50%;background:#fff;border:2px solid #b23b3b;display:flex;align-items:center;justify-content:center;font-size:13px;box-shadow:0 1px 4px rgba(0,0,0,.4);}
.toolbar button#btnDnc.active{background:#b23b3b;color:#fff;}
</style>
</head>
<body>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>(function(){try{if(window.L&&L.map&&!L.__ap){L.__ap=1;var o=L.map;L.map=function(){var m=o.apply(this,arguments);window.__LMAP=m;return m;};}}catch(e){}})();</script>
<script src="status.js"></script>
<script>
const TPARAM = (new URLSearchParams(location.search).get('t')||'1');
const ISALL = (TPARAM === 'all');

// ====== 全体図（?t=all）／各区域画面の振り分け ======
if(ISALL){ buildOverview(); } else { buildTerritory(); }

// ====== 全体図ビュー ======
function buildOverview(){
  document.title = "桔梗が丘会衆 区域全体";
  document.querySelector('header .no').textContent = "全体";
  document.querySelector('header .name').textContent = "桔梗が丘会衆 区域全体";
  document.getElementById('count').style.display = 'none';
  // 区域作業用のUIは隠す
  document.querySelector('.toolbar').style.display = 'none';
  document.querySelector('.legend').style.display = 'none';
  document.getElementById('notice').style.display = 'none';
  var _pill = document.getElementById('btnSvc'); if(_pill) _pill.style.display='none';

  const map = L.map('map',{zoomControl:false,maxZoom:21}).setView([34.62,136.16],12);
  L.control.zoom({position:'topright'}).addTo(map);
  L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png',{
    maxZoom:21, maxNativeZoom:18, attribution:"地理院地図（国土地理院）"
  }).addTo(map);

  let bounds = null;
  // 会衆全体の外枠（白フチ＋紫線で見やすく、内側はごく薄く着色）
  if(window.CONGREGATION && window.CONGREGATION.boundary && window.CONGREGATION.boundary.length){
    // 下に白い縁取り（どんな地図色の上でも線が浮き立つ）
    L.polygon(window.CONGREGATION.boundary,{color:"#ffffff",weight:7,opacity:.85,fill:false}).addTo(map);
    // 上に本線（紫）＋ごく薄い面
    const cong = L.polygon(window.CONGREGATION.boundary,{color:"#7048e8",weight:3,opacity:1,fillColor:"#7048e8",fillOpacity:.05}).addTo(map);
    bounds = cong.getBounds();
  }
  // 各区域の境界＋丸数字ラベル
  const T = window.TERRITORIES || {};
  Object.keys(T).forEach(function(num){
    const t = T[num];
    if(!t.boundary || !t.boundary.length) return;
    const p = L.polygon(t.boundary,{color:"#d9333f",weight:2.5,fillColor:"#d9333f",fillOpacity:.28}).addTo(map);
    p.on('click',function(){ location.search = '?t='+num; });
    // 重心（単純平均）にラベル
    let la=0, lo=0;
    t.boundary.forEach(function(c){ la+=c[0]; lo+=c[1]; });
    la/=t.boundary.length; lo/=t.boundary.length;
    const label = L.marker([la,lo],{icon:L.divIcon({className:"",html:'<div class="terr-label">'+num+'</div>',iconSize:[30,30],iconAnchor:[15,15]})}).addTo(map);
    label.on('click',function(){ location.search = '?t='+num; });
    bounds = bounds ? bounds.extend(p.getBounds()) : p.getBounds();
  });
  if(bounds) map.fitBounds(bounds,{padding:[30,30]});
  setTimeout(function(){ map.invalidateSize(); }, 300);

  // ---- 区域一覧（状態バッジ付き。状態は status.js の window.TERR_STATUS から）----
  const ovBtn=document.getElementById('btnOvList');
  ovBtn.style.display='block';
  const ovSheet=document.getElementById('ovSheet');
  ovBtn.onclick=function(){ renderOv(); ovSheet.style.display='flex'; };
  document.getElementById('ovX').onclick=function(){ ovSheet.style.display='none'; };
  ovSheet.onclick=function(e){ if(e.target===ovSheet) ovSheet.style.display='none'; };
  function renderOv(){
    const TT=window.TERRITORIES||{}, SS=window.TERR_STATUS||{};
    const nums=Object.keys(TT).sort(function(a,b){return parseInt(a,10)-parseInt(b,10);});
    let free=0;
    const rows=nums.map(function(n){
      const st=SS[n]||''; let cls='na', lab='未設定';
      if(st==='空き'){ cls='free'; lab='空き'; free++; }
      else if(st==='貸出中'){ cls='used'; lab='貸出中'; }
      else if(st){ cls='used'; lab=st; }
      return '<div class="ov-item" data-n="'+n+'"><div class="num">'+n+'</div>'+
        '<div class="nm">'+(TT[n].name||('区域'+n))+'</div>'+
        '<span class="ov-badge '+cls+'">'+lab+'</span></div>';
    }).join('');
    document.getElementById('ovSum').innerHTML='全 '+nums.length+' 区域 ・ 空き <b>'+free+'</b>';
    document.getElementById('ovBody').innerHTML=rows||'<div class="empty">区域がありません。</div>';
    document.getElementById('ovBody').querySelectorAll('.ov-item').forEach(function(r){
      r.onclick=function(){ location.search='?t='+r.dataset.n; };
    });
  }
}

// ====== 各区域ビュー ======
function buildTerritory(){
const TDATA = (window.TERRITORIES && window.TERRITORIES[TPARAM]) || (window.TERRITORIES && window.TERRITORIES['1']) || {name:'',boundary:[]};
const TERR_ID = "terr-"+TPARAM;
document.title = "区域"+TPARAM+" "+TDATA.name;
document.querySelector('header .no').textContent = "区域 "+TPARAM;
document.querySelector('header .name').textContent = TDATA.name;
const STATUSES = {
met:{label:"会えた", color:"#f5b400"},
revisit:{label:"再訪問", color:"#1f6feb"},
posted:{label:"投函", color:"#2ea043"},
dnc:{label:"訪問しない", color:"#d9333f"},
away:{label:"留守", color:"#9E9E9E"}
};
const ORDER = ["met","revisit","posted","dnc","away"];

// 区域境界（territories.js から取得）
const BOUNDARY = TDATA.boundary;

// ---- 地図初期化（地理院地図タイル）----
const map = L.map('map',{zoomControl:false,maxZoom:21}).setView([34.6437,136.1150],17);
L.control.zoom({position:'topright'}).addTo(map);
L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png',{
maxZoom:21, maxNativeZoom:18, attribution:"地理院地図（国土地理院）"
}).addTo(map);
const poly = L.polygon(BOUNDARY,{color:"#d9333f",weight:3,fillColor:"#d9333f",fillOpacity:.10}).addTo(map);
map.fitBounds(poly.getBounds(),{padding:[40,40]});

// ---- データ ----
let houses = load();
let addMode = false;
let meMarker = null;

function load(){ try{return JSON.parse(localStorage.getItem(TERR_ID))||[]}catch(e){return []} }
function save(){ localStorage.setItem(TERR_ID, JSON.stringify(houses)); updateCount(); showRevisit(); }
function updateCount(){ document.getElementById('count').textContent = houses.length+"件"; }

// ---- マーカー描画 ----
const layer = L.layerGroup().addTo(map);
function pinIcon(color){
return L.divIcon({className:"",html:'<div class="house-pin" style="background:'+color+'"></div>',iconSize:[18,18],iconAnchor:[9,9]});
}
function render(){
layer.clearLayers();
houses.forEach(function(h){

function showDone(svcMin){
const todayStr=today();
const n=houses.filter(function(h){return h.date===todayStr;}).length;
let _s = n>0 ? ('今日は '+n+' 軒を記録しました。') : '';
if(svcMin){ _s = (_s?_s+' ':'') + '伝道時間 '+fmtDur(svcMin)+'。'; }
document.getElementById('doneSummary').textContent = _s;
let idx=parseInt(localStorage.getItem('praiseIdx')||'0',10);
if(isNaN(idx)||idx<0) idx=0;
idx=idx % PRAISE.length;
const v=PRAISE[idx];
localStorage.setItem('praiseIdx', String((idx+1)%PRAISE.length));
document.getElementById('doneVerse').innerHTML='<span class="q">'+v.q+'</span><span class="ref">— '+v.ref+'</span>';
document.getElementById('done').style.display='flex';
}

// ---- 伝道スタート/終了（奉仕記録：日付・時間帯・所要時間。端末内・個人通算、区域番号タグ付き）----
const SVC_LOG='svc-log', SVC_ACTIVE='svc-active';
function svcLoad(){ try{return JSON.parse(localStorage.getItem(SVC_LOG))||[]}catch(e){return []} }
function svcSave(a){ localStorage.setItem(SVC_LOG, JSON.stringify(a)); }
function svcActive(){ try{return JSON.parse(localStorage.getItem(SVC_ACTIVE))||null}catch(e){return null} }
function svcSetActive(o){ if(o){localStorage.setItem(SVC_ACTIVE,JSON.stringify(o));} else {localStorage.removeItem(SVC_ACTIVE);} }
function pad2(n){ return (n<10?'0':'')+n; }
function ymd(ms){ const d=new Date(ms); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
const SVC_WD=['日','月','火','水','木','金','土'];
function fmtDate(ms){ const d=new Date(ms); return (d.getMonth()+1)+'/'+d.getDate()+'('+SVC_WD[d.getDay()]+')'; }
function fmtTime(ms){ const d=new Date(ms); return d.getHours()+':'+pad2(d.getMinutes()); }
function fmtDur(min){ const h=Math.floor(min/60), m=min%60; return (h>0?h+'時間':'')+m+'分'; }
function elapsed(ms){ let s=Math.floor((Date.now()-ms)/1000); const h=Math.floor(s/3600); s-=h*3600; const m=Math.floor(s/60); s-=m*60; return h+':'+pad2(m)+':'+pad2(s); }

const svcBtn=document.getElementById('btnSvc');
let svcTimer=null;
function svcPaint(){
  const a=svcActive();
  if(a){
    svcBtn.classList.add('running');
    svcBtn.textContent='■ 伝道終了 ・ '+elapsed(a.start);
    if(!svcTimer) svcTimer=setInterval(svcPaint,1000);
  } else {
    svcBtn.classList.remove('running');
    svcBtn.textContent='▶ 伝道スタート';
    if(svcTimer){ clearInterval(svcTimer); svcTimer=null; }
  }
}
svcBtn.onclick=function(){
  const a=svcActive();
  if(!a){
    svcSetActive({start:Date.now(), terr:TPARAM});
    svcPaint();
  } else {
    const end=Date.now();
    const min=Math.max(1, Math.round((end-a.start)/60000));
    const log=svcLoad();
    log.push({id:Date.now(), date:ymd(a.start), start:a.start, end:end, min:min, terr:a.terr||TPARAM});
    svcSave(log);
    svcSetActive(null);
    svcPaint();
    showDone(min);
  }
};

function renderSvc(){
  const log=svcLoad().slice().sort(function(a,b){return b.start-a.start;});
  const now=new Date(); const ym=now.getFullYear()+'-'+pad2(now.getMonth()+1);
  const thisM=log.filter(function(x){return (x.date||'').slice(0,7)===ym;});
  const days=new Set(thisM.map(function(x){return x.date;})).size;
  const mins=thisM.reduce(function(s,x){return s+(x.min||0);},0);
  document.getElementById('svcSum').innerHTML='今月の奉仕：<b>'+days+'</b> 日 ・ 合計 <b>'+fmtDur(mins)+'</b>';
  const b=document.getElementById('svcBody');
  if(!log.length){ b.innerHTML='<div class="empty">まだ奉仕記録がありません。「▶ 伝道スタート」を押すと記録が始まります。</div>'; return; }
  b.innerHTML=log.map(function(x){
    return '<div class="svc-item"><div><div class="d">'+fmtDate(x.start)+'　'+fmtTime(x.start)+'〜'+fmtTime(x.end)+'</div>'+
      '<div class="sub">'+fmtDur(x.min)+(x.terr?' ・ 区域'+x.terr:'')+'</div></div>'+
      '<button class="svc-del" data-id="'+x.id+'">×</button></div>';
  }).join('');
  b.querySelectorAll('.svc-del').forEach(function(btn){
    btn.onclick=function(){
      if(!confirm('この奉仕記録を削除しますか？')) return;
      const id=parseInt(btn.dataset.id,10);
      svcSave(svcLoad().filter(function(x){return x.id!==id;}));
      renderSvc();
    };
  });
}
svcPaint();

render();
showRevisit();
setTimeout(function(){ map.invalidateSize(); }, 300);
} // end buildTerritory
